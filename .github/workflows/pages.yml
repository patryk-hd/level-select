name: Showcase site

# The public showcase on GitHub Pages: site/ (the home page) plus the live demo, the app built
# with `npm run build -- --demo` (the demo library only, nothing personal) in app/, and the
# Level Select phone app (`npm run build -- --phone`, which opens your own copy) in phone/.
# Pull requests only check that it builds. Deploying needs Pages turned on (Settings → Pages →
# Source: GitHub Actions) and happens from main only while the repository is public, so
# nothing goes live before the project does.
# While the repository is private nothing is published, so main doesn't build it at all, and
# pull requests build it only when they change the site or what goes in it.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - site/**
      - scripts/build.mjs
      - library/sample/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build the demo
        run: npm run build -- --demo
      - name: Build the phone app
        run: npm run build -- --phone
      - name: Put the site together
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R dist _site/app
          cp -R dist-phone _site/phone
          test -f _site/index.html && test -f _site/app/library/index.html && test -f _site/phone/sw.js && test -f _site/phone/manifest.webmanifest
          grep -q 'name="level-select-demo"' _site/app/library/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
